<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ПР4 — Менеджер задач</title><link rel="stylesheet" href="./styles.css"><script defer type="module" src="./src/main.js"></script></head>
<body data-practice="04"><main><header><h1>Практическая №4 — Управление задачами</h1><p>Вариант 6: проверка пользовательского интерфейса</p><nav><a href="./">Общий набор</a><a href="./?dataset=variant">Свой вариант</a><a href="./checks.html">Автоматические проверки</a></nav></header>
<section class="panel"><h2 id="editor-heading">Добавление задачи</h2><form id="task-form" novalidate><div class="field"><label for="task-id">ID задачи</label><input id="task-id" name="id" type="number" step="1" min="1" required><p class="field-error" id="task-id-error" data-error-for="id"></p></div><div class="field"><label for="task-title">Название задачи</label><input id="task-title" name="title" type="text" maxlength="100" required><p class="field-error" id="task-title-error" data-error-for="title"></p></div><div class="field"><label for="task-priority">Приоритет</label><select id="task-priority" name="priority"><option value="low">Низкий</option><option value="medium" selected>Средний</option><option value="high">Высокий</option></select><p class="field-error" id="task-priority-error" data-error-for="priority"></p></div><div class="form-actions"><button id="form-submit" type="submit">Добавить задачу</button><button id="cancel-edit" type="button" class="secondary" hidden>Отмена редактирования</button><button id="reset-data" type="button" class="secondary">Сбросить сохранённые данные</button></div></form><p id="storage-status"></p></section>
<section class="panel"><h2>Сводка</h2><div id="task-summary" class="task-summary"><div><strong data-stat="total">—</strong><span>Всего</span></div><div><strong data-stat="completed">—</strong><span>Выполнено</span></div><div><strong data-stat="pending">—</strong><span>В работе</span></div><div><strong data-stat="progress">—</strong><span>Прогресс</span></div><div><strong data-stat="visible">—</strong><span>Показано</span></div></div></section>
<section class="panel"><h2>Фильтры</h2><div id="task-filters"><button type="button" data-filter="all" class="is-active" aria-pressed="true"><span class="filter-label">Все</span></button><button type="button" data-filter="pending" aria-pressed="false"><span class="filter-label">В работе</span></button><button type="button" data-filter="completed" aria-pressed="false"><span class="filter-label">Выполненные</span></button></div></section>
<section class="panel"><h2>Список задач</h2><p id="operation-message" class="message" role="status" aria-live="polite"></p><p id="empty-message" hidden></p><ul id="task-list" class="task-list" aria-label="Список задач"></ul></section></main></body></html>
