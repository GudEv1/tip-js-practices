<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПР3: Управление задачами</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1 id="page-title">Список задач</h1>
    
    <div id="task-filters" class="filters">
      <button type="button" data-filter="all" class="is-active" aria-pressed="true">Все</button>
      <button type="button" data-filter="pending" aria-pressed="false">В работе</button>
      <button type="button" data-filter="completed" aria-pressed="false">Выполненные</button>
    </div>

    <div id="task-summary" class="summary">
      <p>Всего: <span data-stat="total">0</span></p>
      <p>Выполнено: <span data-stat="completed">0</span></p>
      <p>Осталось: <span data-stat="pending">0</span></p>
      <p>Прогресс: <span data-stat="progress">0.0%</span></p>
      <p>Показано: <span data-stat="visible">0</span></p>
    </div>

    <p id="operation-message" class="message" hidden></p>
    <p id="empty-message" class="message" hidden></p>

    <ul id="task-list"></ul>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
